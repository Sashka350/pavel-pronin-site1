<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Страница не найдена — Павел Пронин</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0C0C0C;
      color: #F5F5F5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: clamp(4rem, 16vw, 7rem);
      font-weight: 800;
      line-height: 1;
      color: #D4A843;
    }
    h1 {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 700;
      margin: 1.25rem 0 0.75rem;
      font-family: 'Playfair Display', Georgia, serif;
    }
    p {
      color: #A3A3A3;
      max-width: 34rem;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }
    a.home {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border: 1px solid #2A2A2A;
      border-radius: 8px;
      color: #F5F5F5;
      text-decoration: none;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    a.home:hover {
      color: #D4A843;
      border-color: #D4A843;
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p>Такой страницы больше нет, либо она ещё не опубликована. Материалы постепенно переносятся на новый сайт.</p>
  <a class="home" href="/pavel-pronin-site1/">На главную</a>
</body>
</html>
